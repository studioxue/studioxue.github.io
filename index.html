<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>肖晓媛 · 海报设计作品</title>
<style>
  :root{
    --ink:#1c1c1a;
    --grey:#6b6b66;
    --line:#e2e0da;
    --paper:#fbfaf7;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.7;
  }
  .wrap{max-width:1060px;margin:0 auto;padding:64px 24px 88px}
  header{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:44px}
  h1{
    font-family:"Songti SC","Noto Serif SC","SimSun",serif;
    font-size:30px;font-weight:600;letter-spacing:.12em;
    margin:0 0 10px;
  }
  .sub{color:var(--grey);font-size:14px;letter-spacing:.04em}
  header p.note{margin:16px 0 0;color:var(--grey);font-size:13.5px;max-width:640px}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:44px 32px;
  }
  figure{margin:0}
  figure.wide{grid-column:1/-1}
  figure.wide img{max-height:620px;object-fit:cover;object-position:center}
  figure a{display:block;overflow:hidden;background:#efeee9;border:1px solid var(--line)}
  figure img{display:block;width:100%;height:auto;transition:opacity .2s}
  figure a:hover img{opacity:.9}
  figcaption{margin-top:12px;font-size:13px;color:var(--grey)}
  figcaption b{display:block;color:var(--ink);font-size:14px;font-weight:600;margin-bottom:2px;line-height:1.5}
  footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--grey);font-size:12.5px}
  @media (max-width:520px){
    .wrap{padding:40px 18px 64px}
    h1{font-size:24px}
    .grid{grid-template-columns:1fr;gap:36px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>肖 晓 媛</h1>
    <div class="sub">海报设计作品 · 2026</div>
    <p class="note">中山大学人文高等研究院学术讲座与工作坊宣传海报，均为独立完成设计，成品用于院内学术海报展示并经学院官方渠道发布。</p>
  </header>

  <div class="grid">
    <figure>
      <a href="images/01-visual-collage.jpg"><img src="images/01-visual-collage.jpg" alt="视觉拼贴海报" loading="lazy"></a>
      <figcaption><b>视觉拼贴练习</b>古典雕塑影像与波普网点、肌理叠加</figcaption>
    </figure>

    <figure>
      <a href="images/02-lecture-019.jpg"><img src="images/02-lecture-019.jpg" alt="逸仙进阶讲堂第19讲海报" loading="lazy"></a>
      <figcaption><b>逸仙进阶讲堂 · 019</b>「治理何以可能？」——以现代化背景下的村社治理为对象</figcaption>
    </figure>

    <figure>
      <a href="images/03-workshop-034.jpg"><img src="images/03-workshop-034.jpg" alt="逸仙高研工作坊第34期海报" loading="lazy"></a>
      <figcaption><b>逸仙高研工作坊 · 034</b>「动物、历史与知识」动物史研究工作坊</figcaption>
    </figure>

    <figure>
      <a href="images/04-museum-class-21.jpg"><img src="images/04-museum-class-21.jpg" alt="博物学堂第21期海报" loading="lazy"></a>
      <figcaption><b>博物学堂 · 21 期</b>「纹样为何缠绕？」——一场关于形与意的想象</figcaption>
    </figure>

    <figure>
      <a href="images/05-lecture-022.jpg"><img src="images/05-lecture-022.jpg" alt="逸仙进阶讲堂第22讲海报" loading="lazy"></a>
      <figcaption><b>逸仙进阶讲堂 · 22</b>「道德变迁发生于何处？」——个体反思、集体动力与情感的中间地带</figcaption>
    </figure>

    <figure class="wide">
      <a href="images/06-chunyangtai-009.jpg"><img src="images/06-chunyangtai-009.jpg" alt="逸仙高研讲座春阳台第9讲海报" loading="lazy"></a>
      <figcaption><b>逸仙高研讲座 · 春阳台 009</b>「从大观园到蒙古大草原：大历史、家史与小说的对话」</figcaption>
    </figure>
  </div>

  <footer>此页面仅收录本人设计作品，不含其他个人信息。</footer>
</div>
</body>
</html>
